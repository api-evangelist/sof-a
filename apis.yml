description: 'Sofía is a 100% Mexican health insurance company (aseguradora) offering
  medical coverage for individuals, families, and businesses, delivered primarily
  through a mobile app with plans that carry no deductibles. Regulated in Mexico by
  the CNSF, Secretaría de Salud, and CONDUSEF, and backed by Index Ventures. This
  is a consumer/enterprise insurance provider surfaced as a portfolio-company lead;
  a live probe of the public surface found no developer program, API, or /.well-known/
  discovery documents, so this profile remains identity-only pending any future API
  exposure.'
